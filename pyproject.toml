[project]
name = "gb-calculator"
version = "0.1.0"
description = "Estimate VRAM, hardware requirements, and training time for model inference and training"
requires-python = ">=3.10"
readme = "README.md"
authors = [{ name = "Cursor" }]
license = { text = "MIT" }

[project.scripts]
gbcalc = "gb_calculator.cli:main"

[project.optional-dependencies]
hf = ["huggingface_hub>=0.24.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
